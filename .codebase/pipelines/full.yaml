name: Full Pipeline - Before Merge
trigger: change
jobs:
  emo-full:
    image: hub.byted.org/base/ci_nodejs_22:297bea689b0966fcbdb2daff6b39ed6b
    steps:
      - name: Init
        commands:
          - npm config set registry https://bnpm.byted.org
          - npm install -g @ies/eden-monorepo@3.11.1
      - name: Install
        commands:
          - emo install
      - name: Lint
        commands:
          - python3 scripts/test-agent-neutrality.py
          - python3 scripts/check-agent-neutrality.py
          - emo run lint
      - name: Format
        commands:
          - emo run format:ci --infra
      - name: Build
        commands:
          - emo run build
      - name: Test
        commands:
          - bash scripts/test-link-skills.sh
          - node scripts/test-markdown-comment-skill-install.mjs
          - emo run test
