name: Full Pipeline - Before Merge
trigger: change
jobs:
  full:
    image: hub.byted.org/base/ci_nodejs_22:297bea689b0966fcbdb2daff6b39ed6b
    steps:
      - name: Init
        commands:
          - npm config set registry https://registry.npmjs.org/
      - name: Install
        commands:
          - node common/scripts/install-run-rush.js update
      - name: Lint
        commands:
          - python3 scripts/test-agent-neutrality.py
          - python3 scripts/check-agent-neutrality.py
          - node common/scripts/install-run-rush.js lint
      - name: Format
        commands:
          - node common/scripts/install-run-rush.js format-check
      - name: Build
        commands:
          - node common/scripts/install-run-rush.js typecheck
          - node common/scripts/install-run-rush.js build
      - name: Test
        commands:
          - bash scripts/test-link-skills.sh
          - node scripts/test-markdown-comment-skill-install.mjs
          - node common/scripts/install-run-rush.js test
