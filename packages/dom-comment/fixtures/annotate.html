<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DOM Comment 试玩页</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #171717; background: #fafafa; }
      header { padding: 24px 32px; background: #fff; border-bottom: 1px solid #e5e5e5; }
      main { display: grid; grid-template-columns: 1fr 240px; gap: 24px; padding: 32px; max-width: 960px; }
      button.save { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font: 600 14px inherit; }
      aside { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px; }
      a { color: #2563eb; }
    </style>
  </head>
  <body>
    <header>
      <h1>设置</h1>
      <p>用来试标注：点按钮、划这段字、拖一块区域。</p>
    </header>
    <main>
      <section>
        <p>保存更改后应当出现成功状态，现在没有。请 Agent 诊断为什么点击没有反馈。</p>
        <p>邮箱通知文案要和页面其余部分一致。</p>
        <button class="save" type="button" data-testid="save">保存更改</button>
        <p><a href="#ok">这是一个链接，标注模式下不该跳走。</a></p>
        <label>备注 <input type="text" value="可以划选这里的字" /></label>
      </section>
      <aside>
        <h2>侧栏</h2>
        <p>这一整块信息层级比较乱，适合拖区域。</p>
      </aside>
    </main>
  </body>
</html>
