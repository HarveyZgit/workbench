schema: spec-driven

context: |
  DOM Comment 是 AI Workbench 中的独立 package（packages/dom-comment）。
  它是 markdown-comment 的兄弟产品，不共享包、类型或存储。

  产品（设计 rev 6，见 docs/design.md）：
  - Chrome MV3 扩展，本机 Load unpacked
  - 工具栏打开 popup：图标开始/停止标注；两段可复制 prompt
    `/dom-comment tabid:<id>` 与 `/dom-comment tabid:<id> url:<canonical>`
  - 标注中 Esc 退出，页上必须有提示条
  - 元素 hover+click 与拖拽框选；保存瞬间对目标区域裁切 PNG
  - 存储主键是当前 Chrome 会话的 tabId；文件内用 canonical URL 分页面和截图
  - Agent 查找先解析 tabid/url 参数，再看口语；禁止默认 dump 全部 tab
  - 复现：先看裁切 PNG；`open --tab` 只聚焦原 tab。v1 不上 Playwright / CDP / cookie 导出

  约束：
  - 先有 OpenSpec change 的 tasks.md，再写 src、加依赖、登记 Rush
  - 评论领域层不依赖某一 Agent 宿主；Skill 只调公开 CLI
  - 面向用户的文案用中文；代码标识与 commit 用英文
  - 不要并入 markdown-comment，不要协同服务器

rules:
  proposal:
    - Always include a Non-goals section
    - Keep the proposal under 500 words
    - Write the proposal in Chinese
  specs:
    - Requirements use SHALL/MUST
    - Each requirement has at least one WHEN/THEN scenario
  design:
    - Justify each new dependency with a concrete current requirement
  tasks:
    - Use `- [ ] X.Y` checkboxes exactly
