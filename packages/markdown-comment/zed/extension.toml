id = "markdown-comment"
name = "Markdown Comment"
version = "0.1.0"
schema_version = 1
authors = ["HarveyZ <57336273+HarveyZgit@users.noreply.github.com>"]
description = "Open Markdown Comment browser preview via the local CLI (shared store with the VS Code extension)."
repository = "https://github.com/HarveyZgit/workbench"

[slash_commands.mdc-preview]
description = "Start Markdown Comment preview for a Markdown file (system browser). Pass a path relative to the project root, or absolute."
requires_argument = true

[[capabilities]]
kind = "process:exec"
command = "node"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "markdown-comment"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "sh"
args = ["-c", "**"]
